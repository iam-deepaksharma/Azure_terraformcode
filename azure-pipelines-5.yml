trigger: none

pool: Default

stages:
- stage: TerraformInit
  jobs:
  - job: Terraform
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

  - job: TerraformInit
    dependsOn: Terraform
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)Networking/Lab2'
        backendServiceArm: 'connection2'
        backendAzureRmResourceGroupName: 'rg-lab'
        backendAzureRmStorageAccountName: 'duedatelab'
        backendAzureRmContainerName: 'pipelinetfstate'
        backendAzureRmKey: 'terraform.tfstate'

- stage: TerraformPlan
  dependsOn: TerraformInit
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)Networking/Lab2'
        environmentServiceNameAzureRM: 'connection2'