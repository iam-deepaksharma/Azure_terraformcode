trigger: none

pool: 
  vmImage: 'ubuntu-latest'  # Correct casing for 'vmImage'

variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)/Networking/Lab2'
  terraformVersion: 'latest'
  backendServiceArm: 'connection_01'
  resourceGroupName: 'rg-lab'
  storageAccountName: 'duedatelab'
  containerName: 'pipelinetfstate'
  tfstateKey: 'terraform.tfstate'

stages:
- stage: CodeCoverage
  jobs:
  - job: RunTestsAndCoverage
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'
        addToPath: true

    - script: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        pip install pytest pytest-cov
      displayName: 'Install dependencies'

    - script: |
        source venv/bin/activate
        pytest --cov=my_project --cov-report=xml --cov-report=html
      displayName: 'Run tests with coverage'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'coverage.xml'
        reportDirectory: 'htmlcov'
        failIfCoverageEmpty: true

- stage: TerraformInit
  dependsOn: CodeCoverage  # This stage will only run if CodeCoverage is successful
  jobs:
  - job: TerraformInit
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(backendServiceArm)'  # Azure service connection
        backendAzureRmResourceGroupName: '$(resourceGroupName)'
        backendAzureRmStorageAccountName: '$(storageAccountName)'
        backendAzureRmContainerName: '$(containerName)'
        backendAzureRmKey: '$(tfstateKey)'

- stage: TerraformValidate
  dependsOn: TerraformInit  # This stage will only run if TerraformInit is successful
  jobs:
  - job: TerraformValidate
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

- stage: TerraformPlan
  dependsOn: TerraformValidate  # This stage will only run if TerraformValidate is successful
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(backendServiceArm)'  # Consistent service connection name

- stage: TerraformApply
  dependsOn: TerraformPlan  # This stage will only run if TerraformPlan is successful
  jobs:
  - job: TerraformApply
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(backendServiceArm)'  # Consistent service connection name
