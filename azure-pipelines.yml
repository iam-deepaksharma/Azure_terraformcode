trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Stage1
  displayName: Stage1-print hello world
  jobs:
  - job: job1
    steps:
    - bash: echo "Hello World"
      displayName: "run hello world in stage1"

- stage: Stage2
  displayName: Stage2-print hello india
  jobs:
  - job: job2
    steps:
    - bash: echo "Hello India"
      displayName: "run hello india in stage2"

- stage: Stage3
  displayName: Stage3-print hello Bangalore
  jobs:
  - job: job3
    steps:
    - bash: echo "Hello Bangalore"
      displayName: "run hello Bangalore in stage3"
