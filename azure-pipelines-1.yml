trigger: none

pool: Default

stages:
- stage: terraform
  jobs:
  - job: terraform
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
- stage: Terraforminit
  jobs:
  - job: Terraforminit
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Basic/Lab2'
        backendServiceArm: 'sc-pipeline'
        backendAzureRmResourceGroupName: 'rg-pipeline'
        backendAzureRmStorageAccountName: 'storagecontainerlab'
        backendAzureRmContainerName: 'pipeline-container'
        backendAzureRmKey: 'terraform.tfstate'
- stage: Terraformvalidate
  jobs:
  - job: Terraformvalidate
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Basic/Lab2'
- stage: terraformplan
  jobs:
  - job: terraformplan
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Basic/Lab2'
        environmentServiceNameAzureRM: 'sc-pipeline'
- stage: terraformapply
  jobs:
  - job: terraformapply
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Basic/Lab2'
        environmentServiceNameAzureRM: 'sc-pipeline'